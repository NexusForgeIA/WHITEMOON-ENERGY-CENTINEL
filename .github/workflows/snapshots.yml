name: snapshots
# Cada 4 h guarda lo que REE publica (REData) para auditar sus correcciones. Solo escribe si hay cambios.
on:
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/snapshot.py
      - run: python3 tools/revisions.py > data/snapshots/INFORME.txt || true
      - run: python3 tools/scoreboard.py || true
      - name: Commit
        run: |
          git config user.name "red-sentinel-bot"
          git config user.email "noreply@whitemoon.es"
          git add data/snapshots data/scoreboard.json
          git diff --cached --quiet || git commit -m "snapshot REData $(date -u +%Y-%m-%dT%H:%MZ)" && git push
